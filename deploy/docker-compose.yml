# Every service logs to stdout and the container runtime owns rotation. Without
# an explicit cap the default json-file driver grows until the host disk is
# full, and `RUST_LOG=info` with a per-request span is a steady writer - on a
# single-node box that is a self-inflicted outage of the database as much as of
# the application. 50 MB x 5 bounds the stack at roughly 1 GB of logs.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-noplagiat}
      POSTGRES_USER: ${POSTGRES_USER:-noplagiat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env or the deployment secret store}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - data

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    restart: unless-stopped
    logging: *default-logging
    init: true
    environment:
      APP_DATABASE_URL: ${APP_DATABASE_URL:?set APP_DATABASE_URL in deploy/.env or the deployment secret store}
      APP_LISTEN_ADDR: 0.0.0.0:8080
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-http://localhost:8080}
      RUST_LOG: ${RUST_LOG:-info}
      # Authentication (ADR-014). The default is the secure one: an unset or
      # misspelled APP_AUTH_MODE means `oidc`, never `dev`.
      APP_AUTH_MODE: ${APP_AUTH_MODE:-oidc}
      APP_OIDC_ISSUER: ${APP_OIDC_ISSUER:-}
      APP_OIDC_CLIENT_ID: ${APP_OIDC_CLIENT_ID:-}
      APP_OIDC_CLIENT_SECRET: ${APP_OIDC_CLIENT_SECRET:-}
      APP_OIDC_SCOPES: ${APP_OIDC_SCOPES:-}
      APP_OIDC_GROUPS_CLAIM: ${APP_OIDC_GROUPS_CLAIM:-}
      APP_OIDC_POST_LOGOUT_REDIRECT: ${APP_OIDC_POST_LOGOUT_REDIRECT:-}
      APP_SESSION_TTL_SECONDS: ${APP_SESSION_TTL_SECONDS:-}
      # Ingest. The pepper is not rotatable - see deploy/env.example.
      APP_INGEST_PEPPER: ${APP_INGEST_PEPPER:-}
      APP_SOURCE_TOKEN: ${APP_SOURCE_TOKEN:-}
      APP_INGEST_MAX_AGE_SECONDS: ${APP_INGEST_MAX_AGE_SECONDS:-}
      # Must match the volume mount below: a published report link has to keep
      # resolving across a redeploy (ADR-015 §7).
      APP_REPORTS_DIR: /var/lib/noplagiat/reports
    volumes:
      - reports:/var/lib/noplagiat/reports
    expose:
      - "8080"
    healthcheck:
      # /readyz, not /healthz: readiness also covers database connectivity and
      # ingest freshness (ADR-014 §9). `start_period` covers migrations, which
      # run at startup.
      test:
        ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/readyz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - edge
      - data

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    logging: *default-logging
    init: true
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      NODE_ENV: production
      # SSR fetches reach the API directly on the Compose network, not back out
      # through the gateway (ADR-009). Browser requests stay same-origin via
      # nginx, which is why VITE_API_BASE is deliberately unset.
      API_ORIGIN: ${API_ORIGIN:-http://server:8080}
    expose:
      - "3000"
    depends_on:
      server:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const s=require('node:net').connect(3000,'127.0.0.1');s.once('connect',()=>{s.end();process.exit(0)});s.once('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
    networks:
      - edge

  gateway:
    image: nginx:1.31-alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    volumes:
      # Mounted as a template, not straight into conf.d: the image's entrypoint
      # substitutes ${NGINX_LOCAL_RESOLVERS} on the way from templates/ to
      # conf.d/ - see the `resolver` directive in nginx.conf for why that
      # address cannot be written down here.
      - ./nginx.conf:/etc/nginx/templates/default.conf.template:ro
    environment:
      # Makes 15-local-resolvers.envsh export NGINX_LOCAL_RESOLVERS, read out
      # of the container's /etc/resolv.conf, so the runtime's own DNS server is
      # whatever nginx queries.
      NGINX_ENTRYPOINT_LOCAL_RESOLVERS: "1"
      # Restrict the substitution to that one name. Unfiltered, the entrypoint
      # replaces every variable that happens to exist in the environment, so a
      # future env var colliding with an nginx runtime variable ($host,
      # $scheme, $request_uri, ...) would silently blank it out of the config
      # rather than fail. `$$` is a literal `$` to Compose.
      NGINX_ENVSUBST_FILTER: "^NGINX_LOCAL_RESOLVERS$$"
    depends_on:
      # `service_started`, not `service_healthy`: the server's healthcheck is
      # /readyz, which degrades to 503 when ingest is stale (ADR-014 §9). Stale
      # data must not take the gateway - and with it the public dashboard and
      # every health probe the portal polls - offline.
      server:
        condition: service_started
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
    networks:
      - edge

volumes:
  # PostgreSQL 18 keeps its data directory below /var/lib/postgresql; see the
  # version-compatibility warning in RUNBOOK.md before reattaching this
  # anywhere.
  pgdata:
  # Immutable report snapshots (TZ §4.5). Outlives the container on purpose: a
  # published link must keep resolving to the bytes that were published.
  # This is not a backup - RUNBOOK.md "Backups and restore" covers both.
  reports:

networks:
  edge:
  data:
    internal: true
