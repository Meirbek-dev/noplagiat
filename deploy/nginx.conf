# Edge gateway for the single-node Compose stack (ADR-009, ADR-015 §6).
#
# TLS is terminated by the university reverse proxy in front of this container;
# the listener below speaks plain HTTP on 8080 and trusts `X-Forwarded-*`. It is
# mounted at /etc/nginx/conf.d/default.conf, so everything here is inside the
# stock `http {}` block of the nginx image.

map $http_x_forwarded_proto $external_scheme {
    default $scheme;
    http    http;
    https   https;
}

map $http_x_forwarded_host $external_host {
    default $http_x_forwarded_host;
    ""      $http_host;
}

# HSTS only once the edge has actually terminated TLS. nginx omits a header
# whose value evaluates to the empty string, so a plain-HTTP staging host stays
# reachable instead of pinning every visiting browser to an https:// origin that
# does not exist yet.
map $external_scheme $hsts_value {
    https   "max-age=31536000; includeSubDomains";
    default "";
}

# The DNS server that the `resolve` parameters below query. Its address is not
# the same on every container runtime: Docker answers on the fixed embedded
# address 127.0.0.11, while podman runs aardvark-dns on the gateway address of
# whichever subnet it allocated for the network (10.89.x.1). Hardcoding either
# one leaves every upstream permanently unresolvable on the other, and nginx
# then answers `no live upstreams` - a 502 on every route, /healthz included,
# while the API and SSR containers both report healthy.
#
# `${NGINX_LOCAL_RESOLVERS}` is filled in at container start from
# /etc/resolv.conf by the image's own 15-local-resolvers.envsh, which
# docker-compose.yml switches on with NGINX_ENTRYPOINT_LOCAL_RESOLVERS. That is
# also why this file is mounted into /etc/nginx/templates rather than straight
# into conf.d - the substitution happens on the way out of the template dir.
#
# nginx cannot read /etc/resolv.conf on its own: `resolver local=on` is an
# NGINX Plus directive, and open-source 1.31 parses `local=on` as a hostname
# and refuses to start.
resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;

upstream rust_api {
    zone rust_api 64k;
    server server:8080 resolve;
    keepalive 32;
}

upstream ssr_web {
    zone ssr_web 64k;
    server web:3000 resolve;
    keepalive 32;
}

server {
    listen 8080;
    server_name _;

    # The version number is free reconnaissance and buys the operator nothing.
    server_tokens off;

    # Nothing in this application accepts an upload: the admin contour posts
    # small JSON documents, and both export routes are POST-a-filter,
    # GET-a-file. 2m is therefore generous rather than tight, and it caps how
    # much an unauthenticated body can cost the API.
    client_max_body_size 2m;

    # The stock nginx.conf of the image ships `#gzip on;` - commented out - and
    # neither the Rust API nor the SSR process compresses anything, so without
    # this block every JS bundle, JSON payload and CSV export crosses the
    # university WAN uncompressed.
    #
    # `SameSite=Lax` on the session cookie means a cross-site request never
    # carries credentials, which is what removes the BREACH concern that
    # normally argues against compressing authenticated responses.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        text/css
        text/csv
        text/javascript
        text/plain;
    # Deliberately absent from `gzip_types`: application/pdf, font/woff2 and the
    # .xlsx media type are all already-compressed containers, so a second pass
    # costs CPU and returns nothing. The xlsx type is also 65 characters long,
    # which on its own overflows the default `types_hash_bucket_size` of 64 and
    # makes nginx refuse to start - verified with `nginx -t`.

    proxy_http_version 1.1;
    proxy_set_header Host $external_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $external_host;
    proxy_set_header X-Forwarded-Proto $external_scheme;
    # Required for the `keepalive` pools above to do anything. This replaces an
    # earlier `$connection_upgrade` map, which resolved to `close` on every
    # request that was not a WebSocket handshake - that is, on every request
    # this application serves, since it opens no WebSocket and no SSE stream -
    # and so tore down and reopened an upstream TCP connection per request.
    proxy_set_header Connection "";

    location = /healthz {
        # Liveness only. This is the probe the university proxy should poll:
        # it stays 200 while the process is up, whereas /readyz reports 503 on
        # stale ingest and would take the public dashboard out of the pool for
        # a data problem that does not stop the site from serving.
        proxy_pass http://rust_api;
    }

    location = /readyz {
        proxy_pass http://rust_api;
    }

    # ADR-014 §8 / ADR-015 §6: /metrics must not be reachable from the external
    # origin. It exposes route-level request volumes, ingest counters and
    # suppression counts - operational detail, not public-contour data.
    #
    # 444 (close the connection, send nothing) rather than 403: whether this
    # endpoint exists is itself not the external origin's business, and a 403
    # answers that question. The location stays declared so the path remains
    # reserved for the scrape and nothing else can claim it
    # (ARCHITECTURE.md §8).
    location = /metrics {
        access_log off;
        return 444;
    }

    location = /api {
        add_header Strict-Transport-Security $hsts_value always;
        proxy_read_timeout 120s;
        proxy_pass http://rust_api;
    }

    location ^~ /api/ {
        # No CSP, nosniff or Referrer-Policy here on purpose: the Rust API sets
        # its own per-contour headers (api::layers::security), and an
        # `add_header` at this layer would arrive alongside them rather than
        # replacing them - two Content-Security-Policy headers are intersected
        # by the browser, which is a confusing way to get a policy nobody wrote.
        add_header Strict-Transport-Security $hsts_value always;
        # Report and spreadsheet rendering is synchronous; 60s is close enough
        # to a full-year Приложение-1 render to turn a slow report into a 504.
        proxy_read_timeout 120s;
        proxy_pass http://rust_api;
    }

    # The chromeless portal widget (TZ §8) - the one route that must be
    # framable, and only by the portal.
    #
    # The SSR process sends no document CSP at all, so before this block every
    # HTML response - including the authenticated dashboard - was framable by
    # any origin on the internet. The API's own `frame-ancestors` covers JSON
    # responses under /api, which nobody frames; it never reached the documents.
    #
    # Replace these origins if the portal moves. `X-Frame-Options` is
    # deliberately NOT set here: it has no multi-origin form, and browsers that
    # honour it would override the CSP and block the portal outright.
    location = /embed {
        add_header Content-Security-Policy "frame-ancestors https://tou.edu.kz https://www.tou.edu.kz" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security $hsts_value always;

        proxy_pass http://ssr_web;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    location / {
        # Everything that is not the widget: the public dashboard, /app, /admin
        # and /login. None of it may be framed.
        #
        # nginx REPLACES an inherited `add_header` set rather than merging it,
        # which is why the HSTS line is repeated in every location that adds a
        # header of its own. Removing it here silently drops HSTS from every
        # HTML response.
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security $hsts_value always;

        proxy_pass http://ssr_web;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}

# Internal scrape listener for Prometheus (ADR-014 §8, ADR-015 §6).
#
# Commented out because the monitoring network's address range is a deployment
# fact this repository does not know. To enable it:
#
#   1. replace 10.0.0.0/8 with the monitoring network's actual CIDR - an
#      `allow` that is wider than the scraper undoes the point of this block;
#   2. publish 9090 only on the monitoring network, never in the `ports:` of
#      docker-compose.yml, which maps to the host;
#   3. record the change in deploy/RUNBOOK.md, since it widens the surface.
#
# The listener carries nothing but /metrics: a second entrance to the
# application would be a second thing to secure.
