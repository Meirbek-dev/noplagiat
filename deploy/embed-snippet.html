<!doctype html>
<!--
  Toraighyrov University - antiplagiarism analytics embed snippet (TZ §8).

  Copy the <div> and the <script> below into the portal page. Everything is
  self-contained: no build step, no framework, no external asset. Replace
  DASHBOARD_ORIGIN with the deployed origin of the dashboard.

  Query parameters the widget understands (all optional):

    section    summary | dynamics | work-types | histogram | yoy | faculties
    period     month | semester | year | 3y | 5y | custom   (default: year)
    from,to    YYYY-MM-DD - required when period=custom
    faculty    faculty dictionary code
    workType   work-type dictionary code
    status     accepted | needs_revision | rejected | recheck
    lang       ru | kk | en   (otherwise the visitor's cookie, then RU)

  The widget posts { type: "np-embed-height", height } to the parent on every
  layout change; the listener below resizes the iframe so the page never shows
  a nested scrollbar.
-->
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Академическая честность - виджет портала</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        font-family: Arial, "Helvetica Neue", sans-serif;
      }
      .np-embed {
        max-width: 1100px;
        margin: 0 auto;
      }
      .np-embed iframe {
        display: block;
        width: 100%;
        border: 0;
        /* Replaced by the first height message; also the no-JS fallback. */
        height: 420px;
      }
    </style>
  </head>
  <body>
    <!-- ── copy from here ──────────────────────────────────────────────── -->
    <div class="np-embed">
      <iframe
        id="np-embed-frame"
        src="http://localhost:3000/embed?section=summary&period=year"
        title="Академическая честность - открытая статистика"
        loading="lazy"
        referrerpolicy="no-referrer"
        sandbox="allow-scripts allow-same-origin"
      ></iframe>
    </div>

    <script>
      ;(function () {
        var frame = document.getElementById("np-embed-frame")
        if (!frame) return

        // Only accept height messages from the frame we embedded, and only
        // when they carry a sane pixel count.
        var origin = new URL(frame.getAttribute("src"), location.href).origin

        window.addEventListener("message", function (event) {
          if (event.origin !== origin) return
          if (event.source !== frame.contentWindow) return

          var data = event.data
          if (!data || data.type !== "np-embed-height") return

          var height = Number(data.height)
          if (!isFinite(height) || height <= 0 || height > 20000) return

          frame.style.height = Math.ceil(height) + "px"
        })
      })()
    </script>
    <!-- ── copy to here ────────────────────────────────────────────────── -->
  </body>
</html>
