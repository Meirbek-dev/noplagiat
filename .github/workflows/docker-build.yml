# Container images (ADR-015 §8).
#
# ci.yml proves the source compiles, lints and passes its tests on a GitHub
# runner. Nothing in it proves the artefacts that actually get deployed can be
# BUILT, and the two are not the same claim: `deploy/Dockerfile.web` spent its
# whole life unable to complete `bun install` (the root `prepare` script shells
# out to git, which the bun image does not carry) and then, once that was fixed,
# produced an image that exited on boot with ERR_MODULE_NOT_FOUND. CI was green
# throughout. This workflow closes that gap.
#
# Build-only. Nothing is pushed to a registry and no credentials are needed,
# so `permissions: contents: read` is the whole permission surface.
name: container images

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  images:
    name: build and smoke-test images
    runs-on: ubuntu-24.04
    # The API image compiles the Rust workspace in release mode, which no job in
    # ci.yml does on the PR path.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Build context is the repository root for both images; each Dockerfile
      # is narrowed by its own ignore file (`.dockerignore` for the server,
      # `deploy/Dockerfile.web.dockerignore` for the web image). Building here
      # is what keeps those two files honest - a stray entry that hides a COPY
      # source fails this step instead of a deployment.
      - name: Build the API image
        run: |
          docker build \
            --file deploy/Dockerfile.server \
            --tag noplagiat-server:ci \
            .

      - name: Build the web image
        run: |
          docker build \
            --file deploy/Dockerfile.web \
            --tag noplagiat-web:ci \
            .

      # A successful build is not a working image. The SSR entrypoint imports
      # dist/server/server.js at module scope, before it ever calls listen(), so
      # any unresolved dependency kills the process at boot rather than at the
      # first request. That makes "answers one HTTP request" a sufficient probe:
      # if the module graph is incomplete, nothing here responds at all.
      - name: Web image boots and serves
        run: |
          docker run --detach --name web-smoke \
            --publish 127.0.0.1:3000:3000 \
            --env API_ORIGIN=http://127.0.0.1:9 \
            noplagiat-web:ci

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 5 \
                 --output /dev/null http://127.0.0.1:3000/robots.txt; then
              echo "web image served a request after ${attempt}s"
              exit 0
            fi
            sleep 1
          done

          echo "::error file=deploy/Dockerfile.web::web image never served a request"
          docker logs web-smoke
          exit 1

      - name: Stop the smoke-test container
        if: always()
        run: docker rm --force web-smoke || true

      # nginx parses its configuration only at startup, so a typo here is a
      # gateway that never comes back after a deploy. `-t` is the same check
      # nginx runs on boot, against the image Compose actually pins.
      #
      # Mounted and configured exactly as docker-compose.yml does it, which is
      # the whole point of the gate. In particular the file goes into
      # `templates/`, not straight into `conf.d/`: it holds
      # `resolver ${NGINX_LOCAL_RESOLVERS}`, and that placeholder is filled in
      # by the image's own entrypoint on the way from templates/ to conf.d/.
      # Mounted into conf.d the substitution never runs, and `nginx -t` fails on
      # the literal `${NGINX_LOCAL_RESOLVERS}` - which is a broken gate, not a
      # broken config. The two variables are the same pair Compose sets, and
      # single quotes keep the `$` anchor out of the shell's hands.
      - name: Gateway configuration is valid
        run: |
          docker run --rm \
            --volume "${{ github.workspace }}/deploy/nginx.conf:/etc/nginx/templates/default.conf.template:ro" \
            --env NGINX_ENTRYPOINT_LOCAL_RESOLVERS=1 \
            --env 'NGINX_ENVSUBST_FILTER=^NGINX_LOCAL_RESOLVERS$' \
            nginx:1.31-alpine nginx -t

      # `config` resolves every interpolation, anchor and `depends_on` target.
      # The values below are throwaways that satisfy the two `:?` guards; they
      # are never connected to anything.
      - name: Compose file is valid
        env:
          POSTGRES_PASSWORD: ci-not-a-real-secret
          APP_DATABASE_URL: postgres://noplagiat:ci-not-a-real-secret@postgres:5432/noplagiat
        run: docker compose --file deploy/docker-compose.yml config --quiet
