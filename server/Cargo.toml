[workspace]
resolver = "3"
members = [".", "crates/*"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
domain = { path = "crates/domain" }
compliance = { path = "crates/compliance" }
db = { path = "crates/db" }
ingest = { path = "crates/ingest" }
reports = { path = "crates/reports" }
api = { path = "crates/api" }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# Full debuginfo across ~20 test binaries that statically link the typst tree
# produced >13 GB of PDBs per rebuild and repeatedly filled the 50 GB dev
# volume (LNK1318 / "no space on device"). Line tables keep usable panic
# backtraces at a fraction of the size; release builds are unaffected.
[profile.dev]
debug = "line-tables-only"

[package]
name = "noplagiat-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "noplagiat-server"
path = "src/main.rs"

[[bin]]
name = "export-openapi"
path = "src/bin/export_openapi.rs"

# Historical-backfill CLI (ADR-008 §10, ADR-011).
[[bin]]
name = "ingest-csv"
path = "src/bin/ingest_csv.rs"

# Manual Приложение-1 snapshot CLI (`vp run report:generate`, RUNBOOK W4.3).
[[bin]]
name = "generate-report"
path = "src/bin/generate_report.rs"

[dependencies]
anyhow = "1.0.104"
api.workspace = true
axum = "0.8.9"
db.workspace = true
domain.workspace = true
dotenvy = "0.15.7"
ingest.workspace = true
# `generate-report` stamps snapshots with the wall clock (a CLI, not the
# deterministic library path).
jiff = "0.2.35"
# `reports::default_out_dir` - where snapshots are written (`APP_REPORTS_DIR`).
reports.workspace = true
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
