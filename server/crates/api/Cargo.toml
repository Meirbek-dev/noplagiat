[package]
name = "api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Argon2id password hashing for local accounts (ADR-017 §4). The PHC output
# format is what lets the cost parameters be raised without invalidating the
# hashes already stored.
argon2 = "0.6.0"
axum = "0.8.9"
compliance.workspace = true
db.workspace = true
domain.workspace = true
garde = { version = "0.23.0", features = ["derive"] }
hex = "0.4.3"
# Admin-triggered ingest runs and the `staff_units` HMAC derivation (ADR-014 §6).
ingest.workspace = true
jiff = "0.2.35"
# Session ids, CSRF tokens and password salts, all from the OS CSPRNG.
rand = { version = "0.9.5", features = ["os_rng"] }
# The export renderers (TZ §4.4) - document model, XLSX and PDF.
reports.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# ETag digests in `layers::cache`.
sha2 = "0.10.9"
# Session storage (ADR-012 §3): the only SQL the `api` crate owns. Same feature
# set as `db` so the two share one driver build and one `.sqlx/` cache.
sqlx = { version = "0.9.0", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
  "migrate",
  "macros",
  "json",
  "uuid",
  "time",
] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.0", features = [
  "trace",
  "cors",
  "compression-gzip",
  "set-header",
  "fs",
] }
tracing = "0.1.44"
utoipa = { version = "5.5.0", features = ["axum_extras"] }

[dev-dependencies]
db = { workspace = true, features = ["test-support"] }
tower = { version = "0.5.3", features = ["util"] }

[lints]
workspace = true
