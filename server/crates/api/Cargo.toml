[package]
name = "api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum = "0.8.9"
# PKCE verifier/challenge and the JWK modulus, all base64url (ADR-014 §7).
base64 = "0.22"
compliance.workspace = true
db.workspace = true
domain.workspace = true
garde = { version = "0.23.0", features = ["derive"] }
hex = "0.4.3"
# Admin-triggered ingest runs and the `staff_units` HMAC derivation (ADR-014 §6).
ingest.workspace = true
jiff = "0.2.35"
# ID-token signature and claim validation against the IdP's JWKS (ADR-014 §1).
jsonwebtoken = { version = "11.0.0", default-features = false, features = [
  "use_pem",
  "aws_lc_rs",
] }
rand = { version = "0.9.5", features = ["os_rng"] }
# Same client and TLS stack `ingest` already builds: OIDC discovery, JWKS and
# the token endpoint.
reqwest = { version = "0.13.4", default-features = false, features = [
  "rustls",
  "json",
  # The token endpoint takes `application/x-www-form-urlencoded` (RFC 6749 §4.1.3).
  "form",
] }
# The export renderers (TZ §4.4) - document model, XLSX and PDF.
reports.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
# Session storage (ADR-012 §3): the only SQL the `api` crate owns. Same feature
# set as `db` so the two share one driver build and one `.sqlx/` cache.
sqlx = { version = "0.9.0", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
  "migrate",
  "macros",
  "json",
  "uuid",
  "time",
] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.0", features = [
  "trace",
  "cors",
  "compression-gzip",
  "set-header",
  "fs",
] }
tracing = "0.1.44"
utoipa = { version = "5.5.0", features = ["axum_extras"] }

[dev-dependencies]
db = { workspace = true, features = ["test-support"] }
tower = { version = "0.5.3", features = ["util"] }

[lints]
workspace = true
