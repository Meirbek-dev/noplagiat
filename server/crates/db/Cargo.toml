[package]
name = "db"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Fixture loading helpers used by `#[sqlx::test]` integration tests and by the
# e2e seeding path. Never enabled by the server binary.
test-support = []

[dependencies]
compliance.workspace = true
domain.workspace = true
jiff = { version = "0.2.35", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
  "migrate",
  "macros",
  "json",
  "uuid",
  "time",
] }
thiserror = "2.0.20"
tracing = "0.1.44"

[dev-dependencies]
# Self dev-dependency: enables `test-support` for this crate's own test targets
# without leaking the fixture loaders into the server binary.
db = { path = ".", features = ["test-support"] }

[lints]
workspace = true
